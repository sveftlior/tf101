<title>TF101 谁的笑颜在你心里是第一位？</title>
<style>
:root{--bg:#fff7fa;--paper:#fff;--ink:#201b1d;--muted:#9a8f94;--line:#f0e5e9;--pink:#ff6f9d;--pink2:#ff9fbd;--soft:#fff0f5;--shadow:0 18px 50px rgba(94,50,67,.10)}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:radial-gradient(circle at 15% 5%,#ffe9f1 0,transparent 27%),radial-gradient(circle at 88% 12%,#fff0f5 0,transparent 24%),linear-gradient(180deg,#fff9fb,#fff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",Arial,sans-serif}
button{font:inherit} body{min-height:100vh} .app{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
.hero{text-align:center;padding:22px 0 24px} .logo{display:inline-flex;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid #f4dce5;box-shadow:0 5px 20px rgba(255,111,157,.08);font-size:12px;font-weight:900;letter-spacing:.16em;color:#df5d88}
.hero h1{margin:16px auto 8px;max-width:860px;font-size:clamp(31px,5.2vw,58px);line-height:1.08;letter-spacing:-.045em;font-weight:950} .hero h1 .brand{color:var(--pink)} .hero p{margin:0;color:var(--muted);font-size:14px}
.panel{background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:22px} .home{text-align:center;padding:34px 24px 30px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px} .badge{background:var(--soft);color:#a85b78;border:1px solid #f6d6e2;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:800}
.btn{appearance:none;border:0;border-radius:999px;padding:13px 22px;cursor:pointer;font-weight:900;transition:.16s ease} .btn:active{transform:scale(.98)} .btn.primary{background:linear-gradient(135deg,var(--pink),#ff8fb3);color:#fff;box-shadow:0 10px 24px rgba(255,111,157,.25)} .btn.light{background:#fff;border:1px solid var(--line);color:#6e6469}
.hidden{display:none!important} .topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px} .stage{font-size:13px;font-weight:900;white-space:nowrap;color:#8e6877} .progress-wrap{height:10px;flex:1;background:#f5e7ed;border-radius:999px;overflow:hidden} .progress{height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--pink));transition:width .2s ease} .round{font-size:12px;color:#a09499;white-space:nowrap}
.match-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px} .card{position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--line);background:#fff;cursor:pointer;box-shadow:0 8px 22px rgba(95,53,70,.07);transition:.18s ease} .card:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(95,53,70,.12)} .card:active{transform:scale(.992)}

</div><div id="toast" class="toast"></div>

const TOTAL_ROUNDS=30,TOPN=9,SAVE_KEY='tf101_top9_pages_v1'; let state=null; const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function fresh(){return{pool:ALL.map((x,i)=>({...x,id:'p'+i,score:0,shown:0,wins:0})),round:0,current:null,history:[]}}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function pickFour(){let c=[...state.pool];if(state.round<15){c.sort((a,b)=>(a.shown-b.shown)||Math.random()-.5);return c.slice(0,4)} const f=[...state.pool].sort((a,b)=>b.score-a.score||a.shown-b.shown),top=f.slice(0,20),rest=f.slice(20),out=[];while(out.length<3&&top.length)out.push(top.splice(Math.floor(Math.random()*top.length),1)[0]);let p=(Math.random()<.55&&rest.length)?rest:top;while(out.length<4&&p.length){let q=p.splice(Math.floor(Math.random()*p.length),1)[0];if(!out.some(x=>x.id===q.id))out.push(q)}while(out.length<4){let q=f[Math.floor(Math.random()*f.length)];if(!out.some(x=>x.id===q.id))out.push(q)}return out}
function ph(p){return `<div class="photo" style="background-position:${p.x}% ${p.y}%"></div>`}
function card(p){let a=document.createElement('article');a.className='card';a.innerHTML=`${ph(p)}<div class="info"><div class="name">${p.name}</div><div class="group">${p.group}</div><div class="hint">点这里选择</div></div>`;a.onclick=()=>choose(p.id);return a}
function render(){if(state.round>=TOTAL_ROUNDS)return finish();if(!state.current)state.current=pickFour().map(x=>x.id);let g=$('matchGrid');g.innerHTML='';state.current.map(id=>state.pool.find(x=>x.id===id)).forEach(p=>g.appendChild(card(p)));$('stageLabel').textContent=state.round<15?'初筛':'加赛';$('roundLabel').textContent=(state.round+1)+' / '+TOTAL_ROUNDS;$('progress').style.width=(state.round/TOTAL_ROUNDS*100)+'%';persist()}
function choose(id){let ps=state.current.map(pid=>state.pool.find(x=>x.id===pid));state.history.push(JSON.stringify({round:state.round,current:[...state.current],snapshot:ps.map(p=>({id:p.id,score:p.score,shown:p.shown,wins:p.wins}))}));ps.forEach(p=>{p.shown++;if(p.id===id){p.score+=3;p.wins++}else p.score-=.4});state.round++;state.current=null;render()}
function finish(){persist();$('game').classList.add('hidden');$('result').classList.remove('hidden');let r=[...state.pool].sort((a,b)=>b.score-a.score||b.wins-a.wins||a.shown-b.shown).slice(0,TOPN);$('resultGrid').innerHTML=r.map((p,i)=>`<article class="result-card"><div class="rank">#${i+1}</div>${ph(p)}<div class="info"><div class="name">${p.name}</div><div class="group">${p.group}</div></div></article>`).join('')}
$('startBtn').onclick=()=>{state=fresh();$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()};
$('undoBtn').onclick=()=>{if(!state||!state.history.length)return;let s=JSON.parse(state.history.pop());s.snapshot.forEach(sp=>Object.assign(state.pool.find(x=>x.id===sp.id),sp));state.round=s.round;state.current=s.current;render()};
$('saveBtn').onclick=()=>{persist();toast('已保存进度')}; $('exitBtn').onclick=()=>{persist();$('game').classList.add('hidden');$('home').classList.remove('hidden')};
$('copyBtn').onclick=async()=>{let r=[...state.pool].sort((a,b)=>b.score-a.score||b.wins-a.wins||a.shown-b.shown).slice(0,TOPN),text='我的TF101喜欢脸TOP9\n'+r.map((p,i)=>(i+1)+'位 '+p.name).join('\n');try{await navigator.clipboard.writeText(text);toast('已复制')}catch(e){toast('复制失败')}};
$('restartBtn').onclick=()=>{localStorage.removeItem(SAVE_KEY);state=null;$('result').classList.add('hidden');$('home').classList.remove('hidden')};
</script>
